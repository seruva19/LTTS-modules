name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out LTTS core
        uses: actions/checkout@v4
        with:
          repository: seruva19/LTTS
          path: LTTS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: LTTS/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r LTTS/requirements-dev.txt
      - name: Validate every module in isolation
        env:
          LTTS_SKIP_MODULE_VENVS: '1'
        run: python tools/headless_validate.py --ltts-root LTTS --jobs 2 --timeout 120
